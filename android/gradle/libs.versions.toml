# Phien ban GHIM CUNG. AD-2 cam dung `latest.release` vi LiteRT-LM con o 0.x.
[versions]
agp = "9.4.0"
kotlin = "2.4.20"   # chi de tham chieu; AGP 9+ tu quan Kotlin
coreKtx = "1.15.0"
appcompat = "1.7.0"
coroutines = "1.9.0"
# LiteRT-LM nam tren repo Maven cua Google, KHONG phai Maven Central.
# 0.17.0 la ban release tai 2026-09-13. Nhip phat hanh 2-5 tuan/ban.
litertlm = "0.17.0"
onnxruntime = "1.20.0"
junit = "4.13.2"
json = "20250107"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# org.json la lop cua FRAMEWORK Android — trong unit test JVM no bi stub va nem
# "Method not mocked". Can ban that de test parser JSON chay dung.
json = { group = "org.json", name = "json", version.ref = "json" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
